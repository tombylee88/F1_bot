name: Riepilogo settimanale

on:
  schedule:
    # Ogni giovedì alle 07:00 UTC (08:00 in inverno, 09:00 in estate in Italia)
    - cron: "0 7 * * 4"
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly = solo se c'è un GP, force = invia comunque, debug = solo log, setup = registra il menu"
        type: choice
        default: force
        options: [weekly, force, debug, setup]

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Invia il riepilogo
        run: python3 bot.py ${{ github.event.inputs.mode || 'weekly' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
